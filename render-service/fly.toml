# Deploy from repo root (build context needs ../src and ../public -- see Dockerfile header):
#   flyctl deploy . --config render-service/fly.toml
# Note: paths in this file (dockerfile below) resolve relative to this config file's own
# directory (render-service/), not the repo root -- confirmed via flyctl v0.4.63.
#
# RENDER_SERVICE_KEY is a secret, not set here -- after the app exists:
#   flyctl secrets set RENDER_SERVICE_KEY=<value> --config render-service/fly.toml
# The same value goes into the render-print-file Edge Function's RENDER_SERVICE_KEY secret.

app = "chromaforge-render"
primary_region = "iad" # TODO: confirm/adjust to match the Supabase project's region for lower latency

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # 2026-07-05: printful.js's renderAndUploadPrintFiles now fires all of a checkout's
  # placement renders concurrently instead of one at a time (fixed a real "preparing
  # checkout" slowness, confirmed live -- each placement is a full server round trip at
  # true print resolution). That's only safe with a hard cap of 1 request per machine here:
  # without it, two large concurrent renders (e.g. mesh shorts' ~49Mpx front+back) could
  # land on the SAME machine and hold both sets of buffers in memory simultaneously, which
  # is worse than the sequential OOM this app already hit once today. With this limit, Fly's
  # own proxy spreads concurrent requests across the machines already provisioned (2 today)
  # instead of stacking them on one, and queues/auto-starts more only if that's not enough.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 1
    soft_limit = 1

[[vm]]
  # shared-cpu-1x caps out at 2048mb memory regardless of what's requested (confirmed live,
  # 2026-07-05 -- flyctl rejected 4096mb with "cannot exceed 2048 MiB"); performance-2x is
  # the smallest tier whose memory ceiling actually covers the 4096mb this needs (its own
  # extra CPU core is unused by this single-threaded Node service, just came bundled with
  # the memory tier).
  size = "performance-2x"
  # 512mb OOM-killed mid-render on a real product's printfile spec (confirmed live,
  # 2026-07-01 -- anon-rss hit 412MB and the kernel killed the node process). Some
  # printfiles run up to ~6000x6000px; the raw RGBA buffer alone is ~144MB, plus Skia/Node
  # overhead and PNG encoding headroom on top.
  #
  # Bumped 1024mb -> 2048mb (2026-07-05) alongside fixing a real bug in render-print-file's
  # dimension validation that had been rejecting checkout on several real products (mesh
  # shorts, joggers, sweatshirt, track jacket). 2048mb was NOT enough -- confirmed OOM-killed
  # live minutes later on a real mesh-shorts checkout attempt (anon-rss:1905132kB, i.e. right
  # at the 2048mb ceiling) rendering front then back sequentially on the same warm machine,
  # each ~49Mpx. Bumped again to 4096mb the same day, alongside forcing an explicit
  # global.gc() after every response in server.js (see its own comment -- the working theory
  # is @napi-rs/canvas's native buffers outrunning V8's lazy GC between two large sequential
  # renders, not any single render alone needing this much). Also not yet re-verified live at
  # this size -- this service scales to zero when idle, so the extra headroom only costs
  # anything while actually rendering, which made being generous here an easy call given two
  # rounds of under-provisioning already blocked real checkouts.
  memory = "4096mb"
