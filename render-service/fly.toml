# Deploy from repo root (build context needs ../src and ../public -- see Dockerfile header):
#   flyctl deploy . --config render-service/fly.toml --dockerfile render-service/Dockerfile
#
# RENDER_SERVICE_KEY is a secret, not set here -- after the app exists:
#   flyctl secrets set RENDER_SERVICE_KEY=<value> --config render-service/fly.toml
# The same value goes into the render-print-file Edge Function's RENDER_SERVICE_KEY secret.

app = "chromaforge-render"
primary_region = "iad" # TODO: confirm/adjust to match the Supabase project's region for lower latency

[build]
  dockerfile = "render-service/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
