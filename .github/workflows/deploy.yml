name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite bakes VITE_* vars into the bundle at build time, not runtime -- without
          # these the production build ships with Supabase unconfigured (src/lib/supabase.js
          # exports null and warns instead of crashing, so this fails silently: auth, the
          # gallery, and checkout all just no-op). Add these two as repo secrets under
          # Settings -> Secrets and variables -> Actions, same values as local .env.local.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare Turnstile sitekey (public value, kept as a repo secret alongside the
          # others for consistency). Optional: unset means the auth forms render no CAPTCHA
          # widget -- only safe while the Supabase dashboard's CAPTCHA protection toggle is
          # also off. See src/components/ui/Turnstile.jsx.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # rsync over SSH replaced the old FTP deploy (2026-07-10): Hostinger's FTP endpoint
      # had repeated multi-minute outages that survived even three spaced retry attempts
      # (see git history for the FTP version and its retry ladder; the FTP_* repo secrets
      # still exist if a rollback is ever needed). SSH host/port/user/path are fixed
      # account facts, not secrets -- only the key is. The pinned host key below is the
      # server's real ed25519 key (captured via ssh-keyscan 2026-07-10); if Hostinger
      # migrates the server this check fails loudly rather than trusting a new host
      # silently. --delete keeps the web root an exact mirror of dist/ -- safe because
      # everything the site needs (including .htaccess) ships in dist/ via public/.
      - name: Deploy to Hostinger via rsync over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '[45.137.159.160]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN9ovrpXkuA4/afZmktfMJGvkX5pavmxwZP13E4lACJz' >> ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            if rsync -az --delete --timeout=60 \
              -e "ssh -i ~/.ssh/deploy_key -p 65002 -o ConnectTimeout=15 -o BatchMode=yes" \
              ./dist/ u141529136@45.137.159.160:domains/chromaforge.app/public_html/; then
              echo "Deployed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; waiting 60s"
            sleep 60
          done
          echo "All rsync attempts failed" >&2
          exit 1
