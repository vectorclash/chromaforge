name: Build and Deploy

on:
  push:
    branches:
      - master

# Serializes deploys instead of letting back-to-back pushes fire near-simultaneous SSH
# connections at Hostinger -- suspected trigger of a real failure (2026-07-17) where two
# pushes 25s apart deployed fine individually but the second's rsync failed all 3 retries
# over ~3.75min right after the first's SSH session closed, consistent with a connection-rate
# protection (e.g. fail2ban) on Hostinger's end reacting to the pair. cancel-in-progress:
# false queues the second run to start only once the first fully completes, instead of
# canceling it -- a deploy that's already rsyncing should never be killed mid-transfer.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite bakes VITE_* vars into the bundle at build time, not runtime -- without
          # these the production build ships with Supabase unconfigured (src/lib/supabase.js
          # exports null and warns instead of crashing, so this fails silently: auth, the
          # gallery, and checkout all just no-op). Add these two as repo secrets under
          # Settings -> Secrets and variables -> Actions, same values as local .env.local.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare Turnstile sitekey (public value, kept as a repo secret alongside the
          # others for consistency). Optional: unset means the auth forms render no CAPTCHA
          # widget -- only safe while the Supabase dashboard's CAPTCHA protection toggle is
          # also off. See src/components/ui/Turnstile.jsx.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      # rsync over SSH replaced the old FTP deploy (2026-07-10): Hostinger's FTP endpoint
      # had repeated multi-minute outages that survived even three spaced retry attempts
      # (see git history for the FTP version and its retry ladder; the FTP_* repo secrets
      # still exist if a rollback is ever needed). SSH host/port/user/path are fixed
      # account facts, not secrets -- only the key is. The pinned host key below is the
      # server's real ed25519 key (captured via ssh-keyscan 2026-07-10); if Hostinger
      # migrates the server this check fails loudly rather than trusting a new host
      # silently. --delete-after keeps the web root an exact mirror of dist/ -- safe
      # because everything the site needs (including .htaccess) ships in dist/ via
      # public/. The -after mode matters: plain --delete means --delete-during, which
      # removes the previous build's hashed chunks WHILE the new ones are still being
      # transferred, so anyone mid-session on the old bundle loses their lazily-loaded
      # route chunks for the length of the sync. --delete-after transfers everything
      # first and only then prunes, holding both builds' assets on disk through the
      # window (they coexist fine -- the filenames are content-hashed).
      # The retry ladder is 5 attempts with escalating backoff (60/120/180/240s), covering
      # ~10.5min of unreachability rather than the ~2.5min the old flat 3x60s ladder did.
      # Widened after a real failure (2026-08-27, run 33123115212 attempt 1): all three
      # attempts died on `ssh: connect to host ... port 65002: Connection timed out` -- a TCP
      # connect timeout, so not the key, the pinned host key, or permissions, just Hostinger
      # unreachable. A manual re-run ~3.5min after the last attempt succeeded in 24s, i.e. the
      # outage outlasted the ladder by a little and nothing was wrong with the deploy itself.
      # Note this is NOT the connection-rate/fail2ban case the concurrency comment above
      # describes -- that needs a preceding SSH session and this was a lone push three hours
      # after the previous deploy. Escalating rather than flat so the common case (a blip)
      # still recovers fast while a multi-minute outage gets ridden out; the cost of the long
      # tail is Actions minutes on a run that is already failing. A failed deploy is clean --
      # the build has already succeeded and rsync never starts, so the site keeps serving the
      # previous build intact.
      - name: Deploy to Hostinger via rsync over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '[45.137.159.160]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN9ovrpXkuA4/afZmktfMJGvkX5pavmxwZP13E4lACJz' >> ~/.ssh/known_hosts
          attempt=0
          for delay in 60 120 180 240 ""; do
            attempt=$((attempt + 1))
            if rsync -az --delete-after --timeout=60 \
              -e "ssh -i ~/.ssh/deploy_key -p 65002 -o ConnectTimeout=15 -o BatchMode=yes" \
              ./dist/ u141529136@45.137.159.160:domains/chromaforge.app/public_html/; then
              echo "Deployed on attempt $attempt"
              exit 0
            fi
            if [ -n "$delay" ]; then
              echo "Attempt $attempt failed; waiting ${delay}s"
              sleep "$delay"
            fi
          done
          echo "All rsync attempts failed" >&2
          exit 1
