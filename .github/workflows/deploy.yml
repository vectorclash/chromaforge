name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite bakes VITE_* vars into the bundle at build time, not runtime -- without
          # these the production build ships with Supabase unconfigured (src/lib/supabase.js
          # exports null and warns instead of crashing, so this fails silently: auth, the
          # gallery, and checkout all just no-op). Add these two as repo secrets under
          # Settings -> Secrets and variables -> Actions, same values as local .env.local.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Cloudflare Turnstile sitekey (public value, kept as a repo secret alongside the
          # others for consistency). Optional: unset means the auth forms render no CAPTCHA
          # widget -- only safe while the Supabase dashboard's CAPTCHA protection toggle is
          # also off. See src/components/ui/Turnstile.jsx.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy to Hostinger via FTP
        id: deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_PATH }}
          protocol: ftps
          timeout: 60000

      # Hostinger's FTP endpoint is occasionally flaky. One immediate retry wasn't always
      # enough -- roughly 1 in 10 deploys failed both back-to-back attempts (confirmed from
      # the Actions run history, 2026-07-10) -- so retries now wait 60s first, giving a
      # transient outage time to clear, and there's a third attempt before giving up.
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Retry deploy if failed
        id: retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_PATH }}
          protocol: ftps
          timeout: 60000

      - name: Wait before final retry
        if: steps.retry.outcome == 'failure'
        run: sleep 60

      - name: Final retry
        if: steps.retry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_PATH }}
          protocol: ftps
          timeout: 60000
