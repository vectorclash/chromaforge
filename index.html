<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E1E1E" />
    <meta
      name="description"
      content="A generative art studio in your browser. Craft seed-based artwork, save it to a shared gallery, and wear it — printed on demand, never reprinted."
    />
    <!-- Social sharing cards. og-image.jpg is a real render from the app's own pipeline
         (a fixed seed at 1200x630) -- regenerate with render-service if the generator's
         look ever changes enough that it stops being representative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chromaforge" />
    <meta property="og:title" content="Chromaforge — generative art studio &amp; print shop" />
    <meta
      property="og:description"
      content="Craft seed-based generative artwork, save it to a shared gallery, and wear it — printed on demand, never reprinted."
    />
    <meta property="og:url" content="https://chromaforge.app/" />
    <meta property="og:image" content="https://chromaforge.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chromaforge — generative art studio &amp; print shop" />
    <meta
      name="twitter:description"
      content="Craft seed-based generative artwork, save it to a shared gallery, and wear it — printed on demand, never reprinted."
    />
    <meta name="twitter:image" content="https://chromaforge.app/og-image.jpg" />
    <!-- Overwritten per-route by usePageMeta (src/hooks/usePageMeta.js) once React mounts;
         this static value is what non-JS crawlers/unfurlers see and what "/" itself keeps. -->
    <link rel="canonical" href="https://chromaforge.app/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Chromaforge — generative art studio &amp; print shop</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/createjs.min.js"></script>
    <script src="/jscolor.js"></script>
    <script>
      // Themed to match the app's dark glass UI instead of jscolor's default white
      // widget. Colors/sizes set here cover everything the library draws from its own
      // options; a few bits it sets via inline style (the close button's font/hover)
      // are overridden in src/styles/components.css with !important instead, since
      // presets have no option for them.
      jscolor.presets.default = {
        alphaChannel: false,
        // sized up from the library default for comfortable touch targets, matching
        // the app's generously sized buttons (this picker is used on phones)
        width: 200,
        height: 120,
        sliderSize: 20,
        padding: 14,
        borderWidth: 1,
        borderColor: 'rgba(166,224,0,0.25)', // faint lime edge, for definition against bright art
        borderRadius: 12,
        backgroundColor: 'rgba(10,8,20,0.6)',
        controlBorderColor: 'rgba(166,224,0,0.4)', // same lime used on .button-small/.button-medium
        buttonColor: 'rgba(250,250,250,1)', // matches the app's button/input text color
        shadow: true,
        shadowBlur: 24,
        shadowColor: 'rgba(0,0,0,0.5)',
        closeButton: true,
        buttonHeight: 34,
        closeText: 'CLOSE',
      }
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
